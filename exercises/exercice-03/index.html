<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXO-03 — Hello React (CDN)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carte {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    .btn {
      background: #61dafb;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #21c8f0; }
  </style>
</head>
<body>
  <!-- Point de montage React -->
  <div id="root"></div>

  <!--
    CDN React 18 — deux packages distincts :
    - react : le moteur (Virtual DOM, hooks, logique)
    - react-dom : le pont vers le vrai DOM du navigateur
  -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!--
    Babel Standalone : transpile JSX -> JS dans le navigateur.
    Uniquement pour le developpement / l'apprentissage !
    En production, la transpilation se fait au build time.
  -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!--
    type="text/babel" : indique a Babel de transpiler ce script.
    Sans ce type, le navigateur tenterait d'executer le JSX
    directement et afficherait une erreur de syntaxe.
  -->
  <script type="text/babel">

    // --- Composant enfant ---
    // Recoit des "props" (proprietes) comme parametres
    function Badge({ couleur, texte }) {
      return (
        <span style={{
          background: couleur,
          color: 'white',
          padding: '2px 8px',
          borderRadius: '4px',
          fontSize: '0.75rem',
          fontWeight: 'bold',
        }}>
          {texte}
        </span>
      );
    }

    // --- Composant principal ---
    function HelloReact() {
      // useState : hook de gestion d'etat
      const [compteur, setCompteur] = React.useState(0);

      return (
        <div className="carte">
          <h1 style={{ marginBottom: '0.5rem' }}>
            Hello, React !
          </h1>

          <Badge couleur="#61dafb" texte="v18" />

          <p style={{ margin: '1rem 0', color: '#555' }}>
            Vous avez clique <strong>{compteur} fois</strong>.
          </p>

          <button
            className="btn"
            onClick={() => setCompteur(compteur + 1)}
          >
            Cliquez-moi
          </button>
        </div>
      );
    }

    // --- Montage dans le DOM ---
    // React 18 : createRoot() remplace ReactDOM.render()
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<HelloReact />);

  </script>
</body>
</html>
